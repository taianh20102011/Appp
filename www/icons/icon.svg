<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="64" fill="#2563EB"/>
  <!-- Sub-pixel precision border -->
  <rect x="2" y="2" width="508" height="508" rx="62" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <!-- Brain / Neural Knowledge Network -->
  <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="160" r="32" fill="#FFFFFF"/>
    <circle cx="160" cy="270" r="28" fill="#FFFFFF"/>
    <circle cx="352" cy="270" r="28" fill="#FFFFFF"/>
    <circle cx="200" cy="380" r="24" fill="#FFFFFF"/>
    <circle cx="312" cy="380" r="24" fill="#FFFFFF"/>
    <!-- Connecting synaptic edges -->
    <line x1="256" y1="160" x2="160" y2="270"/>
    <line x1="256" y1="160" x2="352" y2="270"/>
    <line x1="160" y1="270" x2="200" y2="380"/>
    <line x1="352" y1="270" x2="312" y2="380"/>
    <line x1="200" y1="380" x2="312" y2="380"/>
    <line x1="160" y1="270" x2="352" y2="270" stroke-dasharray="8 8"/>
  </g>
  <text x="256" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SMART AI</text>
</svg>
