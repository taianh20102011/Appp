<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART AI - Công Cụ Quản Trị & Cấp Khóa Bản Quyền (Admin Keygen)</title>
  <link rel="stylesheet" href="./css/styles.css">
  <style>
    body {
      background-color: var(--bg-surface);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .keygen-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 580px;
      width: 100%;
      padding: 24px;
    }
    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="keygen-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-divider); padding-bottom: 12px;">
      <div>
        <h2 style="font-size: 1.25rem; font-weight: 800; margin: 0;">SMART AI - Cấp Khóa Bản Quyền (Admin Only)</h2>
        <span style="font-size: 0.78rem; color: var(--text-muted);">Dành riêng cho Tác giả: <strong>Tài Anh</strong> (phamngoctaianh6@gmail.com)</span>
      </div>
      <span class="badge badge-red" style="font-size: 0.7rem;">ADMIN SECURE</span>
    </div>

    <div class="form-group">
      <label>Mã Vân Tay Thiết Bị Của Khách Hàng (Hardware Fingerprint):</label>
      <input type="text" id="targetDeviceId" class="input-text mono-num" placeholder="Ví dụ: E59AEBCBD7FC1310 (để trống nếu muốn tạo khóa dùng chung)">
      <span style="font-size: 0.75rem; color: var(--text-muted);">
        Khách hàng mở app bấm vào nút <strong>Bản Quyền</strong> ➔ <strong>Copy Mã Máy</strong> rồi gửi cho bạn.
      </span>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div class="form-group">
        <label>Gói Bản Quyền (Edition):</label>
        <select id="editionSelect" class="curriculum-dropdown" style="width: 100%;">
          <option value="ACADEMIC_PRO">ACADEMIC_PRO (Học sinh & Nghiên cứu)</option>
          <option value="ENTERPRISE_PRO" selected>ENTERPRISE_PRO (Trường học & Doanh nghiệp)</option>
          <option value="RESEARCH_MAX">RESEARCH_MAX (Tối thượng Lab AI)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Thời Hạn Bản Quyền:</label>
        <select id="durationSelect" class="curriculum-dropdown" style="width: 100%;">
          <option value="30">30 Ngày (Dùng thử VIP)</option>
          <option value="365" selected>1 Năm (365 Ngày)</option>
          <option value="730">2 Năm (730 Ngày)</option>
          <option value="3650">Vĩnh Viễn (10 Năm)</option>
        </select>
      </div>
    </div>

    <button id="btnGenerateKey" class="btn btn-primary" style="width: 100%; margin-top: 14px;">
      🔑 KÝ SỐ & TẠO KHÓA BẢN QUYỀN ECDSA P-256
    </button>

    <div id="outputSection" style="display: none; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-divider);">
      <label style="font-size: 0.85rem; font-weight: 700; color: var(--status-success);">
        ✅ Khóa Bản Quyền Ký Số Mật Mã Bất Đối Xứng (ECDSA P-256):
      </label>
      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <input type="text" id="generatedKeyOutput" class="input-text mono-num" readonly style="font-weight: 700; background: var(--bg-surface-subtle); color: var(--accent-primary); font-size: 0.8rem;">
        <button id="btnCopyKey" class="btn btn-secondary btn-sm" style="white-space: nowrap;">📋 Copy Key</button>
      </div>

      <div id="keySummaryText" style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 8px; line-height: 1.5;"></div>
    </div>
  </div>

  <script>
    // KHÓA BÍ MẬT PRIVATE KEY CỦA TÁC GIẢ TÀI ANH (TUYỆT ĐỐI CHỈ NẰM Ở ĐÂY, KHÔNG ĐƯA VÀO APP)
    const TAI_ANH_PRIVATE_KEY_JWK = {
      key_ops: ["sign"],
      ext: true,
      kty: "EC",
      x: "NdJC43bEwvk8TU97IXgt17NBIZfqQQ77lx3lV3VH2ec",
      y: "RtOit13gUuV_acyChDHh2JtE5OojCosOnzwvtE3tXrM",
      crv: "P-256",
      d: "vM9ftId9FdeJ2gH8hSJ7xlsgJBx1B6E_GMeQhYnCIiA"
    };

    function uint8ArrayToBase64Url(uint8) {
      let binary = '';
      for (let i = 0; i < uint8.byteLength; i++) {
        binary += String.fromCharCode(uint8[i]);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    document.getElementById('btnGenerateKey').addEventListener('click', async () => {
      const edition = document.getElementById('editionSelect').value;
      const days = parseInt(document.getElementById('durationSelect').value, 10);
      const rawDevice = document.getElementById('targetDeviceId').value.trim();

      const expiry = Date.now() + (days * 86400000);
      const expiryHex = expiry.toString(16).toUpperCase();
      const devPart = rawDevice ? rawDevice.substring(0, 8).toUpperCase() : 'UNIVERSAL';

      // Tạo chữ ký số bất đối xứng ECDSA P-256
      try {
        const privKey = await crypto.subtle.importKey(
          'jwk',
          TAI_ANH_PRIVATE_KEY_JWK,
          { name: 'ECDSA', namedCurve: 'P-256' },
          false,
          ['sign']
        );

        const payload = `${edition}:${devPart}:${expiryHex}:TAI_ANH_SMART_AI`;
        const data = new TextEncoder().encode(payload);

        const sigBuffer = await crypto.subtle.sign(
          { name: 'ECDSA', hash: { name: 'SHA-256' } },
          privKey,
          data
        );

        const sigB64Url = uint8ArrayToBase64Url(new Uint8Array(sigBuffer));
        const keyStr = `SMART-${edition}-${devPart}-${expiryHex}-${sigB64Url}`;

        const outSec = document.getElementById('outputSection');
        outSec.style.display = 'block';
        document.getElementById('generatedKeyOutput').value = keyStr;

        const boundDesc = devPart !== 'UNIVERSAL' 
          ? `Khóa được <strong>khóa cứng theo mã máy [${devPart}]</strong>. Nếu học sinh gửi key này cho bạn bè dùng trên máy khác sẽ bị từ chối ngay lập tức!` 
          : `Khóa dùng chung (Universal) cho tất cả thiết bị.`;

        document.getElementById('keySummaryText').innerHTML = `
          • <strong>Thuật toán:</strong> Mật mã bất đối xứng NIST ECDSA Curve P-256 + SHA-256.<br>
          • <strong>Hạn dùng:</strong> ${new Date(expiry).toLocaleDateString('vi-VN')} (${days} ngày).<br>
          • <strong>Ràng buộc thiết bị:</strong> ${boundDesc}<br>
          • <strong>Bảo mật:</strong> Người dùng dù mở F12 xem toàn bộ code Public Key của app cũng KHÔNG THỂ hack hoặc tự tạo key mới được!
        `;
      } catch (err) {
        alert('Lỗi tạo khóa ECDSA: ' + err.message);
      }
    });

    document.getElementById('btnCopyKey').addEventListener('click', () => {
      const input = document.getElementById('generatedKeyOutput');
      input.select();
      navigator.clipboard.writeText(input.value).then(() => {
        alert('Đã sao chép Khóa Bản Quyền ECDSA P-256! Bạn có thể gửi mã này cho khách hàng.');
      });
    });
  </script>
</body>
</html>
