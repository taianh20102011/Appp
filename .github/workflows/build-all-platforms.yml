name: Auto-Build Multi-Platform Apps (Windows, macOS, Android)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. BUILD WINDOWS DESKTOP APP (.EXE)
  build-windows:
    name: Build Windows App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Compile Windows App (.exe)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SMART-AI-Windows-App
          path: dist/*.exe

  # 2. BUILD MACOS DESKTOP APP (.DMG / .ZIP)
  build-macos:
    name: Build macOS App (.dmg, .zip)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Compile macOS DMG & ZIP
        run: npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SMART-AI-macOS-App
          path: |
            dist/*.dmg
            dist/*.zip

  # 3. BUILD ANDROID MOBILE APP (.APK)
  build-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & sync Capacitor assets
        run: |
          npm install
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMART-AI-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

  # 4. CREATE GITHUB RELEASE WITH ALL DOWNLOADABLE INSTALLERS
  release:
    name: Create GitHub Release with All Packages
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: SMART AI Release v1.0.0 (Windows, macOS, Android)
          body: |
            ## 🚀 SMART AI – Bộ cài đặt đa nền tảng tự động biên dịch
            Tự động sinh bởi CI/CD GitHub Actions:
            - **Windows**: Tải file `.exe` (Bản Portable chạy ngay)
            - **macOS**: Tải file `.dmg` hoặc `.zip` cho máy Mac Intel / Apple Silicon
            - **Android**: Tải file `.apk` cài trực tiếp lên điện thoại hoặc máy tính bảng Android
            - **Web**: Chạy trực tiếp qua trình duyệt với PWA Offline Mode
          files: |
            SMART-AI-Windows-App/*.exe
            SMART-AI-macOS-App/*.dmg
            SMART-AI-macOS-App/*.zip
            SMART-AI-Android-APK/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
